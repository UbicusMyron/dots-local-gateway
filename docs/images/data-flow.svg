<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect width="1600" height="1080" fill="#F4F7FC"/>
<text x="65" y="94" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="46" fill="#17263D">数据流｜结果返回哪里，凭证放在哪里</text>
<text x="65" y="137" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#53647B">绿色箭头：业务数据返回方向　金色箭头：Mac 在本地使用凭证</text>
<rect x="1065" y="230" width="470" height="185" rx="18" fill="#FFFFFF" stroke="#D8E1EE" stroke-width="2"/>
<text x="1089" y="279" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="29" fill="#16836B">① 第三方 API</text>
<text x="1089" y="323" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">返回 JSON 数据</text>
<text x="1089" y="360" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">或返回文件内容</text>
<rect x="565" y="230" width="470" height="185" rx="18" fill="#FFFFFF" stroke="#D8E1EE" stroke-width="2"/>
<text x="589" y="279" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="29" fill="#16836B">② Mac 本地网关</text>
<text x="589" y="323" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">检查返回结果</text>
<text x="589" y="360" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">附上 request_id</text>
<rect x="65" y="230" width="470" height="185" rx="18" fill="#FFFFFF" stroke="#D8E1EE" stroke-width="2"/>
<text x="89" y="279" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="29" fill="#16836B">③ dots / 聊天工具</text>
<text x="89" y="323" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">沿本次调用通道接收结果</text>
<text x="89" y="360" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">交给业务脚本或展示给用户</text>
<path d="M1065,323 L1042,323" stroke="#16836B" stroke-width="5"/><polygon points="1042,323 1057.3076007399955,315.6055859201091 1057.3076007399955,330.3944140798909" fill="#16836B"/>
<path d="M565,323 L542,323" stroke="#16836B" stroke-width="5"/><polygon points="542,323 557.3076007399955,315.6055859201091 557.3076007399955,330.3944140798909" fill="#16836B"/>
<text x="65" y="198" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#53647B">返回通道：Tunnel 或已确认的脚本入口</text>
<path d="M300,415 L300,515" stroke="#16836B" stroke-width="5"/><polygon points="300,515 292.6055859201091,499.6923992600045 307.3944140798909,499.6923992600045" fill="#16836B"/>
<rect x="65" y="525" width="470" height="185" rx="18" fill="#FFFFFF" stroke="#D8E1EE" stroke-width="2"/>
<text x="89" y="574" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="29" fill="#16836B">④ 保存到指定位置</text>
<text x="89" y="618" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">JSON：业务脚本保存或汇总</text>
<text x="89" y="655" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">文件：Client.download 保存</text>
<text x="89" y="692" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">在 dots 报告路径及请求编号</text>
<rect x="565" y="525" width="470" height="185" rx="18" fill="#FFFFFF" stroke="#D8E1EE" stroke-width="2"/>
<text x="589" y="574" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="29" fill="#A06A15">Mac 上的本地凭证</text>
<text x="589" y="618" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">provider.secret → 第三方 API</text>
<text x="589" y="655" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">caller.secret → 本地网关</text>
<text x="589" y="692" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">tunnel-runtime.secret → Tunnel</text>
<path d="M800,525 L800,425" stroke="#B98226" stroke-width="5"/><polygon points="800,425 807.3944140798909,440.3076007399955 792.6055859201091,440.3076007399955" fill="#B98226"/>
<rect x="1065" y="525" width="470" height="185" rx="18" fill="#FFFFFF" stroke="#D8E1EE" stroke-width="2"/>
<text x="1089" y="574" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="29" fill="#7354BA">dots 脚本所需资料</text>
<text x="1089" y="618" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">服务、账户、接口路径</text>
<text x="1089" y="655" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">已确认的 MCP 地址</text>
<text x="1089" y="692" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17263D">该入口的公司调用凭证</text>
<rect x="65" y="790" width="1470" height="190" rx="18" fill="#E5F2ED" stroke="#E5F2ED" stroke-width="2"/>
<text x="95" y="847" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="31" fill="#16836B">交接时按此表处理</text>
<text x="95" y="897" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="27" fill="#17263D">业务数据 / 下载文件 → dots；第三方平台 key / Tunnel runtime key → Mac 本地。</text>
<text x="95" y="947" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#53647B">直接 MCP 脚本入口的连接凭证由管理员单独交付；文件下载后核对保存路径。</text>
</svg>